  /api/v1/bookings/bulk-update/:
    post:
      operationId: v1_bookings_bulk_update_create
      description: |-
        Confirm or cancel several of your bookings in one request.

        Example body: {"updates": [{"id": 1, "action": "confirm"}, {"id": 2, "action": "cancel"}],
        "all_or_nothing": false}
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkBookingUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BulkBookingUpdate'
          multipart/form-data:
