components:
  schemas:
    Accommodation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        destination:
          type: integer
        destination_name:
          type: string
          readOnly: true
        accommodation_type:
          $ref: '#/components/schemas/AccommodationTypeEnum'
        type_display:
          type: string
          readOnly: true
        description:
          type: string
        price_per_night:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        max_guests:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        amenities: {}
        address:
          type: string
          maxLength: 300
        contact_email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        contact_phone:
          type: string
          maxLength: 20
        image:
          type: string
          format: uri
          nullable: true
        is_available:
          type: boolean
      required:
      - accommodation_type
      - address
      - description
      - destination
      - destination_name
      - id
      - max_guests
      - name
      - price_per_night
      - type_display
    AccommodationTypeEnum:
      enum:
      - hotel
      - hostel
      - rental
      - resort
      - bnb
      type: string
      description: |-
        * `hotel` - Hotel
        * `hostel` - Hostel
        * `rental` - Vacation Rental
        * `resort` - Resort
        * `bnb` - B&B
    Activity:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        destination:
          type: integer
        destination_name:
          type: string
          readOnly: true
        category:
          $ref: '#/components/schemas/ActivityCategoryEnum'
        description:
          type: string
        duration_hours:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,1})?$
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        max_participants:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        requirements:
          type: string
        image:
          type: string
          format: uri
          nullable: true
        is_available:
          type: boolean
      required:
      - category
      - description
      - destination
      - destination_name
      - duration_hours
      - id
      - name
      - price
    ActivityCategoryEnum:
      enum:
      - tour
      - attraction
      - dining
      - shopping
      - entertainment
      - outdoor
      type: string
      description: |-
        * `tour` - Tour
        * `attraction` - Attraction
        * `dining` - Dining
        * `shopping` - Shopping
        * `entertainment` - Entertainment
        * `outdoor` - Outdoor
    ActivityLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
          nullable: true
        username:
          type: string
          readOnly: true
        itinerary:
          type: integer
          readOnly: true
          nullable: true
        action:
          allOf:
          - $ref: '#/components/schemas/ActivityLogActionEnum'
          readOnly: true
        action_display:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - action_display
      - created_at
      - description
      - id
      - itinerary
      - user
      - username
    ActivityLogActionEnum:
      enum:
      - created
      - updated
      - deleted
      - status_changed
      - shared
      - unshared
      - booking
      - expense
      - document
      type: string
      description: |-
        * `created` - Created
        * `updated` - Updated
        * `deleted` - Deleted
        * `status_changed` - Status changed
        * `shared` - Shared
        * `unshared` - Unshared
        * `booking` - Booking
        * `expense` - Expense
        * `document` - Document
    Booking:
      type: object
      description: Create/update bookings. Price, status and code are computed by
        the server.
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        itinerary:
          type: integer
        accommodation:
          type: integer
          nullable: true
        activity:
          type: integer
          nullable: true
        item_name:
          type: string
          readOnly: true
          description: Name of the booked accommodation or activity.
        booking_date:
          type: string
          format: date
        check_in:
          type: string
          format: date
          nullable: true
        check_out:
          type: string
          format: date
          nullable: true
        nights:
          type: string
          readOnly: true
          description: Nights for accommodation bookings.
        guests_count:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
        price:
          type: string
          format: decimal
