            - cultural
            - mountain
            - relaxation
        description: |-
          * `beach` - Beach
          * `mountain` - Mountain
          * `city` - City
          * `cultural` - Cultural
          * `adventure` - Adventure
          * `relaxation` - Relaxation
        explode: true
        style: form
      - in: query
        name: climate
        schema:
          type: array
          items:
            type: string
            enum:
            - continental
            - dry
            - polar
            - temperate
            - tropical
        description: |-
          * `tropical` - Tropical
          * `dry` - Dry
          * `temperate` - Temperate
          * `continental` - Continental
          * `polar` - Polar
