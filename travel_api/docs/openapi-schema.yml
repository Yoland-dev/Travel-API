                additionalProperties: {}
          description: ''
  /api/v1/analytics/destination-preferences/:
    get:
      operationId: v1_analytics_destination_preferences_retrieve
      description: Which destination categories, climates and places you choose most.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
